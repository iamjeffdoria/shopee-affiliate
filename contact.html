<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Shopee Deals</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
      <a class="navbar-brand text-orange fw-bold" href="index.html">Shopee Deals</a>
    </div>
  </nav>

  <div class="container py-5">
    <h1 class="fw-bold text-center mb-4">Contact Us</h1>
    <p class="text-center mb-4">Have questions? Reach out to us!</p>
    <form action="mailto:contact@shopeedeals.com" method="post" enctype="text/plain">
      <div class="mb-3">
        <label for="name" class="form-label">Name</label>
        <input type="text" class="form-control" id="name" name="name" required>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="email" required>
      </div>
      <div class="mb-3">
        <label for="message" class="form-label">Message</label>
        <textarea class="form-control" id="message" name="message" rows="5" required></textarea>
      </div>
      <button type="submit" class="btn btn-orange">Send Message</button>
    </form>
  </div>

  <footer class="bg-white text-center py-3 border-top">
    <p class="mb-0 text-muted">&copy; 2026 Shopee Deals.</p>
  </footer>
</body>
</html>
